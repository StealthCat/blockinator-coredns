name: CoreDNS plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Unit tests and race detector
        run: go test -race ./...
      - name: Build CoreDNS with plugin
        run: bash tools/build.sh
      - name: Live UDP/TCP and cache-isolation tests
        env:
          COREDNS_BINARY: ./build/coredns
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
