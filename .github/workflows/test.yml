name: Build CoreDNS with Blockinator
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Unit tests and race detector
        run: go test -race ./...
      - name: Build CoreDNS with plugin
        run: bash tools/build.sh
      - name: Live UDP/TCP and cache-isolation tests
        env:
          COREDNS_BINARY: ./build/coredns
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"

      - name: Package tested CoreDNS binary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 tools/package.py --arch "${{ matrix.arch }}"
      - name: Upload binary and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blockinator-coredns-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blockinator-coredns-*
          merge-multiple: true
          path: dist
      - name: Attach packages to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
